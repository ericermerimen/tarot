<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1a0a2e"/>
      <stop offset="100%" stopColor="#0a0612"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f4cf7c"/>
      <stop offset="100%" stopColor="#c19b4c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>

  <!-- Gold border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5" fill="none" stroke="url(#goldGrad)" strokeWidth="0.8"/>

  <!-- Dog face -->
  <g transform="translate(16, 18)">
    <!-- Floppy ears -->
    <ellipse cx="-9" cy="-6" rx="4.5" ry="7" fill="#c19b4c" transform="rotate(-15, -9, -6)"/>
    <ellipse cx="9" cy="-6" rx="4.5" ry="7" fill="#c19b4c" transform="rotate(15, 9, -6)"/>

    <!-- Head -->
    <circle cx="0" cy="-2" r="9" fill="url(#goldGrad)"/>

    <!-- Inner ears -->
    <ellipse cx="-8" cy="-7" rx="2.5" ry="4" fill="#f4cf7c" transform="rotate(-15, -8, -7)"/>
    <ellipse cx="8" cy="-7" rx="2.5" ry="4" fill="#f4cf7c" transform="rotate(15, 8, -7)"/>

    <!-- Eyes -->
    <ellipse cx="-3.5" cy="-4" rx="2" ry="2.2" fill="#1a0a2e"/>
    <ellipse cx="3.5" cy="-4" rx="2" ry="2.2" fill="#1a0a2e"/>
    <!-- Eye shine -->
    <circle cx="-2.8" cy="-4.8" r="0.8" fill="white"/>
    <circle cx="4.2" cy="-4.8" r="0.8" fill="white"/>

    <!-- Nose -->
    <ellipse cx="0" cy="0" rx="2.2" ry="1.5" fill="#1a0a2e"/>

    <!-- Mouth -->
    <path d="M-2.5,2 Q0,4.5 2.5,2" fill="none" stroke="#1a0a2e" strokeWidth="0.8" strokeLinecap="round"/>

    <!-- Tongue -->
    <ellipse cx="0" cy="3.5" rx="1.2" ry="2" fill="#FF9999"/>
  </g>

  <!-- Stars -->
  <circle cx="5" cy="5" r="1" fill="#f4cf7c" opacity="0.8"/>
  <circle cx="27" cy="6" r="0.7" fill="#f4cf7c" opacity="0.8"/>
</svg>
